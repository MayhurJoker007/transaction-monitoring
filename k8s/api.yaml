apiVersion: apps/v1
kind: Deployment
metadata:
  name: txmon-api
  labels: {app: txmon, component: api}
spec:
  replicas: 2
  selector:
    matchLabels: {app: txmon, component: api}
  template:
    metadata:
      labels: {app: txmon, component: api}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      initContainers:
        - name: migrate
          image: ghcr.io/mayhurjoker007/transaction-monitoring:latest
          command: ["python", "manage.py", "migrate", "--noinput"]
          envFrom: [{configMapRef: {name: txmon-config}}, {secretRef: {name: txmon-secrets}}]
      containers:
        - name: api
          image: ghcr.io/mayhurjoker007/transaction-monitoring:latest
          ports: [{containerPort: 8000}]
          envFrom: [{configMapRef: {name: txmon-config}}, {secretRef: {name: txmon-secrets}}]
          readinessProbe:
            httpGet: {path: /readyz, port: 8000}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 15
          resources:
            requests: {cpu: 200m, memory: 256Mi}
            limits: {memory: 512Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: txmon-api
spec:
  selector: {app: txmon, component: api}
  ports: [{port: 80, targetPort: 8000}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: txmon-api
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: txmon-api}
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
