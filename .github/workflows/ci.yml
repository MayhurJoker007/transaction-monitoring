name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: txmon
          POSTGRES_PASSWORD: txmon
          POSTGRES_DB: txmon
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U txmon" --health-interval 2s --health-retries 15
    env:
      DATABASE_URL: postgres://txmon:txmon@localhost:5432/txmon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest -v

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t transaction-monitoring:${{ github.sha }} .
